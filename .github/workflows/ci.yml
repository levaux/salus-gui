# ci.yml — the v0.1 CI pipeline (plan 001).
#
# One job, one straight line: a scaffold does not yet have enough independent
# surface area to make splitting it worthwhile. Split when build time or
# flakiness isolation actually demands it.
#
# Step → gate mapping, as of v0.1.2:
#   plans-lint          → docs/plans/ register consistency (numbered ⟺ listed
#                          in INDEX, Status lines, backlog freshness, no
#                          dangling plan links). Stdlib-only Python, so it runs
#                          BEFORE install — it needs nothing this workflow has
#                          not already checked out.
#   sync-protos:check   → vendored protos must match packages/proto/salus-commit.lock
#                          (drift gate). Hashes the vendored files rather than
#                          the source, so it needs no Salus checkout here.
#   buf breaking        → wire-compat vs. the tracked baseline image
#                          (packages/proto/.buf-image-prev.binpb). Blocking: a
#                          Salus proto bump that breaks the wire fails here and
#                          has to be reviewed. Regenerate the baseline only on
#                          an intended bump, in the same commit.
#   lint                → eslint + prettier --check
#   typecheck           → tsc -b across every project reference
#   test                → vitest across packages (and apps, from v0.1.5)
#
# `pnpm install` runs the proto package's postinstall (buf generate), so the
# generated code exists before anything typechecks. src/gen is NOT committed:
# it is fully determined by the drift-gated vendored sources plus the pinned
# buf toolchain, so there is nothing to diff and no regenerate-and-diff gate.
#
# Steps later stages add:
#   v0.1.6  check   (svelte-check — tsc does not read .svelte script blocks;
#                    it joins CI when apps/web exists)
#           build   (packages → web → bridge)

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Plans register lint (tools/check-plans.py)
        # Stdlib-only by design: a drift gate that needs a venv goes quiet on
        # exactly the machine where nobody set one up.
        run: python3 tools/check-plans.py

      # Must precede setup-node's `cache: pnpm` below — that option shells out
      # to `pnpm store path` to compute the cache key, so pnpm needs to already
      # be on PATH. `packageManager` in the root package.json pins the exact
      # version corepack activates.
      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        # The proto package's postinstall runs `buf generate`, so src/gen
        # exists from here on without a separate step.
        run: pnpm install --frozen-lockfile

      - name: Proto drift gate (sync-protos --check)
        run: pnpm sync-protos:check

      - name: Wire-compatibility gate (buf breaking)
        run: pnpm --filter @salus-gui/proto breaking

      - name: Lint (eslint + prettier --check)
        run: pnpm lint

      - name: Typecheck (tsc -b)
        run: pnpm typecheck

      - name: Test (vitest)
        run: pnpm test
