syntax = "proto3";

package Salus.Protocol;

import "Common.proto";

option cc_enable_arenas = true;

// ===========================================================================
// Protocol — the typed execution contract for protocol distribution
// (decision §16). This proto is the frozen boundary shared by the Protocol
// service (cloud: import/validate/publish/allocate), the Edge (pull, verify,
// materialize, execute), and Therapy (session/allocation lineage). v0.5.7
// freezes the field numbering for every message here; removed fields are
// reserved and numbers are never reused.
//
// Separation of concerns (decision §16): a source artifact is imported, one or
// more candidates are normalized/validated, an approved candidate is published
// as an IMMUTABLE ProtocolRevision, a client is allocated an exact revision via
// a versioned ProtocolAssignment, and Edge pulls + verifies + executes locally
// (online or offline). The current assignment names an immutable revision, never
// a mutable protocol name like "Combo_1"; editing a protocol makes a new
// revision, reassignment makes a new allocation revision.
//
// The typed modality catalog (HBOT / RED_LIGHT / INFRARED_SAUNA / COLD_PLUNGE /
// SUPPLEMENT) and its per-modality parameters replace clinical free-text: the
// Edge never parses prose to decide a BLE command. Device modalities compile to
// Therapy configuration values; SUPPLEMENT is a typed presentation/adherence
// step, not a BLE command.
// ===========================================================================

// --------------------------------------------------------------------------
// Closed catalogs (decision: prefer a typed enum over an open string). Every
// enum reserves 0 as an explicit UNSPECIFIED so a missing value never silently
// aliases a real one.
// --------------------------------------------------------------------------

// Normalized time-of-day slots (WAP-3-301). The generator/export source uses
// "Bedtime"; the import adapter normalizes it to EVENING (import is v0.5.8).
enum TimeOfDay {
    TIME_OF_DAY_UNSPECIFIED = 0;
    MORNING                 = 1;
    DAYTIME                 = 2;
    EVENING                 = 3;
    ANYTIME                 = 4;
}

// The modality catalog: HBOT, RL, IR, CP, Supp (WAP-3-301).
enum Modality {
    MODALITY_UNSPECIFIED = 0;
    HBOT                 = 1;   // hyperbaric oxygen
    RED_LIGHT            = 2;   // red / near-infrared light therapy
    INFRARED_SAUNA       = 3;
    COLD_PLUNGE          = 4;
    SUPPLEMENT           = 5;   // non-device: presentation/adherence only
}

// Units for typed modality parameters. Closed so an unexpected unit blocks
// publication rather than silently aggregating.
enum Unit {
    UNIT_UNSPECIFIED = 0;
    ATA              = 1;   // atmospheres absolute (HBOT pressure)
    MINUTES          = 2;
    SECONDS          = 3;
    NANOMETERS       = 4;   // red-light wavelength
    CELSIUS          = 5;   // sauna / plunge temperature
    MILLIGRAMS       = 6;   // supplement dosage
    GRAMS            = 7;
    MILLILITERS      = 8;
    CAPSULES         = 9;
    INTERNATIONAL_UNITS = 10;
}

// Lifecycle of a candidate / revision.
enum PublicationStatus {
    PUBLICATION_STATUS_UNSPECIFIED = 0;
    DRAFT                          = 1;   // candidate, not yet validated clean
    VALIDATED                      = 2;   // candidate passed validation, awaiting approval
    PUBLISHED                      = 3;   // immutable revision, executable
    SUPERSEDED                     = 4;   // replaced by a newer revision
}

// Edge disposition of a pulled assignment (AcknowledgeAssignment) and the
// GetCurrentAssignment fast path.
enum AcknowledgeDisposition {
    ACK_UNSPECIFIED = 0;
    ACK_STORED      = 1;   // verified, materialized, active
    ACK_REJECTED    = 2;   // verification/validation failed (reason carried)
    ACK_NOT_MODIFIED = 3;  // local revision already current (if_none_match hit)
}

// Routine / step execution outcome (ProtocolProgress), append-only.
enum ProgressStatus {
    PROGRESS_UNSPECIFIED = 0;
    PLANNED              = 1;
    STARTED              = 2;
    COMPLETED            = 3;
    SKIPPED              = 4;
    FAILED               = 5;
}

// Severity of a validation finding.
enum ValidationSeverity {
    SEVERITY_UNSPECIFIED = 0;
    INFO                 = 1;
    WARNING              = 2;
    ERROR                = 3;   // blocks publication
}

// --------------------------------------------------------------------------
// Typed modality parameters — one message per modality; a ModalityStep carries
// exactly one via the `params` oneof, and it must match `modality`.
// --------------------------------------------------------------------------

message HbotParams {
    double pressure_ata      = 1;   // e.g. 1.3–3.0 ATA
    uint32 duration_minutes  = 2;
}

message RedLightParams {
    repeated uint32 wavelengths_nm = 1;   // e.g. 630 / 660 / 810 / 830 / 850
    uint32 duration_minutes        = 2;
}

message InfraredSaunaParams {
    double temperature_celsius = 1;
    uint32 duration_minutes    = 2;
}

message ColdPlungeParams {
    double temperature_celsius = 1;
    uint32 duration_minutes    = 2;
}

message SupplementParams {
    string supplement_type = 1;
    double dosage          = 2;
    Unit   dosage_unit     = 3;
}

// One ordered modality action within a slot. Sequencing constraints (RL before
// HBOT, CP after HBOT/IR) are expressed by `order_index` and enforced by the
// structural validator, not by the wire type.
message ModalityStep {
    Modality  modality          = 1;
    uint32    order_index       = 2;   // 0-based order within the slot
    uint32    pre_break_minutes  = 3;
    uint32    post_break_minutes = 4;
    oneof params {
        HbotParams          hbot        = 10;
        RedLightParams      red_light   = 11;
        InfraredSaunaParams infrared    = 12;
        ColdPlungeParams    cold_plunge = 13;
        SupplementParams    supplement  = 14;
    }
}

// A time-of-day slot holding ordered modality steps.
message RoutineSlot {
    TimeOfDay             time_of_day = 1;
    repeated ModalityStep steps       = 2;
}

// One day of the protocol (1-based day_number within [1, duration_days]).
message DayRoutine {
    uint32               day_number = 1;
    repeated RoutineSlot slots       = 2;
}

// --------------------------------------------------------------------------
// Protocol metadata, revision, source, candidate, assignment, progress.
// --------------------------------------------------------------------------

message Provenance {
    string source_system = 1;   // e.g. "ReBase", "operator-upload"
    string uploaded_by   = 2;
    int64  uploaded_at_us = 3;
    string note          = 4;
}

message ProtocolMetadata {
    string          name                  = 1;
    string          category              = 2;
    string          scientific_rationale  = 3;
    string          uniqueness            = 4;
    repeated string tags                  = 5;
    double          effectiveness_score   = 6;
    double          appropriateness_score = 7;
    string          effectiveness_comment = 8;
    repeated string references            = 9;
    string          variation_id          = 10;
}

// Immutable, signed, canonical executable protocol. Identified by revision_id;
// `canonical_hash` is the deterministic hash of the canonical bytes and
// `signature` authenticates it. Never mutated — an edit makes a new revision.
message ProtocolRevision {
    string            revision_id     = 1;
    string            protocol_id     = 2;   // stable across revisions
    uint32            revision_number = 3;
    ProtocolMetadata  metadata        = 4;
    uint32            duration_days   = 5;
    repeated DayRoutine days          = 6;
    string            canonical_hash  = 7;
    bytes             signature       = 8;
    PublicationStatus status          = 9;
    int64             published_at_us = 10;
}

// The exact uploaded artifact, preserved for traceability (never mutated).
message ProtocolSourceArtifact {
    string     artifact_id     = 1;
    bytes      source_bytes    = 2;
    string     declared_format = 3;   // e.g. "wap-json", "generator-export-json"
    string     content_hash    = 4;
    Provenance provenance      = 5;
    int64      imported_at_us  = 6;
}

// A parsed/normalized draft plus validation findings; replaceable before
// publication.
message ProtocolCandidate {
    string                    candidate_id = 1;
    string                    artifact_id  = 2;
    ProtocolRevision          draft        = 3;
    repeated ValidationFinding findings    = 4;
    PublicationStatus         status       = 5;
}

// Pins one client to one immutable revision over an effective window. Immutable;
// superseded by a new assignment revision (never mutated in place).
message ProtocolAssignment {
    string assignment_id       = 1;
    string client_id           = 2;
    string revision_id         = 3;   // the immutable ProtocolRevision
    uint32 assignment_revision = 4;
    int64  effective_from_us   = 5;
    int64  effective_to_us     = 6;   // 0 = open-ended
    string time_zone           = 7;
    bool   revoked             = 8;
}

// Edge acknowledgement of a pulled assignment.
message AssignmentAcknowledgement {
    string                 assignment_id = 1;
    string                 edge_id       = 2;
    AcknowledgeDisposition disposition   = 3;
    string                 reason        = 4;   // set when ACK_REJECTED
    string                 local_hash    = 5;   // materialized revision hash
}

// Append-only routine/step outcome reported by the Edge.
message ProtocolProgress {
    string         client_id          = 1;
    string         assignment_id      = 2;
    string         revision_id        = 3;
    string         routine_instance_id = 4;
    uint32         day_number         = 5;
    TimeOfDay      time_of_day        = 6;
    uint32         step_order_index   = 7;
    Modality       modality           = 8;
    ProgressStatus status             = 9;
    int64          at_us              = 10;
    string         therapy_session_id = 11;   // lineage when a device modality ran
    string         note               = 12;
}

// One validation finding, carrying a STABLE field path + error code so a
// malformed protocol identifies the exact day/slot/step and reason. The path
// uses the canonical dotted/indexed form, e.g.
// "days[3].slots[0].steps[1].hbot.pressure_ata".
message ValidationFinding {
    ValidationSeverity severity   = 1;
    string             field_path = 2;
    string             code       = 3;   // closed catalog, e.g. PROTO_RANGE_HBOT_ATA
    string             message    = 4;
}

message ValidationReport {
    bool                       ok       = 1;   // false if any ERROR finding
    repeated ValidationFinding findings = 2;
}

// --------------------------------------------------------------------------
// Execution lineage & reconciliation (decision §10, §16; edge-identity §6).
// Added at v0.7.1 as the Protocol-OWNED types the Therapy contract consumes:
// Therapy.proto imports these as Salus.Protocol.* rather than redefining them,
// because the reconciliation DECISION is owned by Protocol and only APPLIED by
// Therapy (Therapy.ApplyReconciliationDecision, v0.7.7 — Protocol never writes
// Therapy rows). Adding new symbols keeps the v0.5.7 field-numbering freeze
// intact (no existing number is reused). The claim/entitlement machine itself
// lives in the SalusRecords Protocol store (db/Protocol/), off this wire surface.
// --------------------------------------------------------------------------

// How a routine run was started (edge-identity §6). Stamped on Edge-originated
// Therapy events so downstream can distinguish a cloud-claimed run from a
// not-yet-reconciled offline one before the cloud sets canonical state.
enum ExecutionStartMode {
    EXEC_START_UNSPECIFIED       = 0;
    EXEC_ONLINE_SCHEDULED        = 1;  // cloud claim acquired before BLE start
    EXEC_OFFLINE_SCHEDULED       = 2;  // signed entitlement + local optimistic claim
    EXEC_OFFLINE_MANUAL_FALLBACK = 3;  // ad-hoc typed config; not protocol completion unless policy allows
}

// The cloud's reconciliation verdict for one run — CLOUD-DERIVED, never Edge-set.
// A not-yet-reconciled offline run is UNCONFIRMED; the counted run is CANONICAL;
// a duplicate overlapping run is SUPERSEDED (not counted).
enum ReconciliationStatus {
    RECON_UNSPECIFIED = 0;
    RECON_UNCONFIRMED = 1;  // offline run submitted, not yet reconciled
    RECON_CANONICAL   = 2;  // the counted run for this routine instance
    RECON_SUPERSEDED  = 3;  // a duplicate overlapping run; not counted
}

// Protocol's reconciliation decision for one run, handed to Therapy to apply to
// its OWN session rows (Therapy.ApplyReconciliationDecision, idempotent by
// decision_id). Protocol decides; Therapy is the only writer of a session's
// reconciliation_status/canonical_completion.
message ReconciliationDecision {
    string decision_id          = 1;
    string client_id            = 2;
    string assignment_id        = 3;
    string routine_instance_id  = 4;
    string therapy_session_id   = 5;  // the run this verdict applies to
    ReconciliationStatus status = 6;
    bool   canonical_completion = 7;
    int64  decided_at_us        = 8;
}

// --------------------------------------------------------------------------
// RPC request/response wrappers. (v0.5.7 freezes the contract; the Protocol
// service that implements it lands in v0.5.11.)
// --------------------------------------------------------------------------

message ImportProtocolArtifactRequest { ProtocolSourceArtifact artifact = 1; }
message ImportProtocolArtifactResponse { string artifact_id = 1; }

message ValidateProtocolCandidateRequest { string candidate_id = 1; }
message ValidateProtocolCandidateResponse { ValidationReport report = 1; }

message PublishProtocolRevisionRequest { string candidate_id = 1; }
message PublishProtocolRevisionResponse { ProtocolRevision revision = 1; }

message AllocateProtocolRequest {
    string client_id         = 1;
    string revision_id       = 2;
    int64  effective_from_us = 3;
    int64  effective_to_us   = 4;
    string time_zone         = 5;
}
message AllocateProtocolResponse { ProtocolAssignment assignment = 1; }

message GetCurrentAssignmentRequest {
    string client_id      = 1;
    // The Edge's current-assignment tag: "<revision_id>@<assignment_id>".
    // ACK_NOT_MODIFIED only on an exact match — the tag must identify the
    // assignment (not just the revision) so a re-allocation of the same
    // revision with a new window/zone still converges via pull.
    string if_none_match  = 2;
}
message GetCurrentAssignmentResponse {
    AcknowledgeDisposition disposition = 1;   // ACK_NOT_MODIFIED or a fresh assignment
    ProtocolAssignment     assignment  = 2;
}

message GetProtocolRevisionRequest { string revision_id = 1; }
message GetProtocolRevisionResponse { ProtocolRevision revision = 1; }

message AcknowledgeAssignmentRequest { AssignmentAcknowledgement ack = 1; }
message AcknowledgeAssignmentResponse { bool recorded = 1; }

message ReportProtocolProgressRequest { repeated ProtocolProgress progress = 1; }
message ReportProtocolProgressResponse { uint32 accepted = 1; }

message WatchAssignmentRequest { string client_id = 1; }
// Carries only assignment identity/revision — never the sole delivery path;
// pull (GetCurrentAssignment) is authoritative.
message AssignmentNotice {
    string client_id           = 1;
    string assignment_id       = 2;
    uint32 assignment_revision = 3;
}

service Protocol {
    // Import / validation / publication (cloud-side).
    rpc ImportProtocolArtifact(ImportProtocolArtifactRequest)
        returns (ImportProtocolArtifactResponse);
    rpc ValidateProtocolCandidate(ValidateProtocolCandidateRequest)
        returns (ValidateProtocolCandidateResponse);
    rpc PublishProtocolRevision(PublishProtocolRevisionRequest)
        returns (PublishProtocolRevisionResponse);

    // Allocation + Edge pull/verify/execute (offline-capable, pull-authoritative).
    rpc AllocateProtocol(AllocateProtocolRequest) returns (AllocateProtocolResponse);
    rpc GetCurrentAssignment(GetCurrentAssignmentRequest)
        returns (GetCurrentAssignmentResponse);
    rpc GetProtocolRevision(GetProtocolRevisionRequest)
        returns (GetProtocolRevisionResponse);
    rpc AcknowledgeAssignment(AcknowledgeAssignmentRequest)
        returns (AcknowledgeAssignmentResponse);
    rpc ReportProtocolProgress(ReportProtocolProgressRequest)
        returns (ReportProtocolProgressResponse);

    // Notification only — a lost notice merely delays convergence to the next pull.
    rpc WatchAssignment(WatchAssignmentRequest) returns (stream AssignmentNotice);
}
